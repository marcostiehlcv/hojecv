const SITE="hojecv.app";
let LANG="pt";try{const l=localStorage.getItem("hojecv_lang");if(l==="en"||l==="pt")LANG=l}catch(_){}
const L=()=>I18N[LANG];
const T=e=>LANG==="en"&&e.te?e.te:e.t;
const X=e=>LANG==="en"&&e.xe?e.xe:e.x;
const PL=p=>L().place[p]||p;
const ROMAN_EN={"XV":"15th","XVI":"16th","XVII":"17th","XVIII":"18th","XIX":"19th","XX":"20th","XXI":"21st"};
const ERAS=[["todas","Tudo",0,9999],["xv","Séc. XV–XVIII",1400,1799],["xix","Séc. XIX",1800,1899],["colonial","Séc. XX colonial",1900,1974],["indep","Independência",1975,1990],["democ","Democracia",1991,9999]];
const MO=i=>L().months[i];

const $=id=>document.getElementById(id);
let cur=new Date(); cur.setHours(12,0,0,0);
let cat="todas", cat2="todas", era="todas";
try{const s=localStorage.getItem("hojecv"); if(s){const o=JSON.parse(s); cat=o.cat||cat; era=o.era||era;}}catch(e){}
if(!(cat in I18N.pt.cats))cat="todas";
const save=()=>{try{localStorage.setItem("hojecv",JSON.stringify({cat,era}))}catch(e){}};



const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// Etiqueta: nos acontecimentos mostra o tema; nos nascimentos e falecimentos, o tipo.
const rotulo=e=>e.c==="acontecimento"&&e.tema?e.tema:e.c;
const hit=(e,k)=>k==="todas"||e.c===k||e.tema===k;
const tagCat=e=>{const k=rotulo(e);return`<span class="tag cat c-${k}">${L().cat1[k]||k}</span>`};
// Dia da semana do acontecimento; antes de 15/10/1582 (calendário juliano) não se mostra.
const wdTag=e=>{if(e.y<1582||(e.y===1582&&(e.m<10||(e.m===10&&e.d<15))))return"";return`<span class="wd">${L().week[new Date(Date.UTC(e.y,e.m-1,e.d)).getUTCDay()]}</span>`};
const ago=y=>L().ago(new Date().getFullYear()-y);
const imgTag=(e,cls)=>e.img?`<figure class="${cls}" aria-hidden="true"><img src="${e.img}" alt="" loading="lazy" onerror="var a=this.closest('article');if(a){a.classList.remove('has-img');var c=a.querySelector('.cred');if(c)c.remove();}this.parentNode.remove()"></figure>`:"";
const credit=e=>e.img&&e.cr?`<a class="cred" href="${e.cr}" target="_blank" rel="noopener">${L().credit}</a>`:"";
const srcLink=e=>e.f?`<a class="src" href="${e.f}" target="_blank" rel="noopener">${L().src}</a>`:"";
const itemHTML=(e,showDate)=>`<article class="item${e.img?" has-img":""}"><div class="y">${e.y}${wdTag(e)}</div><div style="min-width:0">${showDate?`<div class="d">${L().shortDate(e.d,MO(e.m-1))}</div>`:""}<h3>${esc(T(e))}</h3><p>${esc(X(e))}</p><div class="meta">${tagCat(e)}<span class="tag">${PL(e.ilha)}</span>${srcLink(e)}</div><div class="acts-row">${shareBtn(e)}${flagBtn(e)}</div></div>${imgTag(e,"thumb")}</article>`;

const MOTIVOS=[["data","A data (dia ou mês) está errada"],["ano","O ano está errado"],["titulo","O título ou o nome está errado"],["descricao","A descrição tem informação incorreta"],["categoria","A categoria está errada"],["local","A ilha ou o local está errado"],["fonte","A fonte não abre ou não confirma o facto"],["imagem","A imagem não corresponde ou é inadequada"],["duplicado","O acontecimento está repetido"],["ofensivo","Conteúdo ofensivo ou inadequado"]];
const hashT=s=>{let x=5381;for(const c of s)x=((x<<5)+x+c.charCodeAt(0))>>>0;return x.toString(36)};
const keyOf=e=>`${e.y}-${String(e.m).padStart(2,"0")}-${String(e.d).padStart(2,"0")}-${hashT(e.t)}`;
const BYKEY={};const indexar=()=>{for(const k in BYKEY)delete BYKEY[k];EVENTS.forEach(e=>BYKEY[keyOf(e)]=e)};indexar();
const sent=new Set((()=>{try{return JSON.parse(localStorage.getItem("hojecv_rep")||"[]")}catch(_){return[]}})());
const saveSent=()=>{try{localStorage.setItem("hojecv_rep",JSON.stringify([...sent]))}catch(_){}};
const flagBtn=e=>{const k=keyOf(e);return sent.has(k)?`<button class="flag" data-done type="button" disabled>${L().flagDone}</button>`:`<button class="flag" data-k="${k}" type="button" aria-label="${L().flagAria}">${L().flag}</button>`};
let repKey=null;
function openRep(k){repKey=k;const e=BYKEY[k];$("repEv").textContent=`${L().longDate(e.d,MO(e.m-1),e.y)} · ${T(e)}`;
 $("repOpts").innerHTML=MOTIVOS.map(([v])=>`<label class="opt"><input type="checkbox" value="${v}" id="mot-${v}"><span>${L().mot[v]}</span></label>`).join("");
 $("repMsg").hidden=true;$("repSend").disabled=true;$("repSend").textContent=L().send;$("rep").hidden=false;$("repOpts").querySelector("input").focus();}
function closeRep(){$("rep").hidden=true;repKey=null;}
$("repOpts").addEventListener("change",()=>{$("repSend").disabled=!$("repOpts").querySelector("input:checked")});
$("repCancel").onclick=closeRep;
$("rep").addEventListener("click",ev=>{if(ev.target.id==="rep")closeRep()});
addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!$("rep").hidden)closeRep()});
$("repSend").onclick=async()=>{
 const mot=[...$("repOpts").querySelectorAll("input:checked")].map(i=>i.value).filter(v=>MOTIVOS.some(m=>m[0]===v));
 if(!mot.length||!repKey)return;const k=repKey;$("repSend").disabled=true;$("repSend").textContent=L().sending;
 const fail=t=>{$("repMsg").textContent=t;$("repMsg").hidden=false;$("repSend").disabled=false;$("repSend").textContent=L().send};
 try{const api=(window.HOJECV_CONFIG||{}).API;
  if(!api){fail(L().failCfg);return}
  const r=await fetch(api,{method:"POST",body:JSON.stringify({chave:k,motivos:mot})});const j=await r.json().catch(()=>({}));
  if(!j.ok){fail(j.erro==="limite"?L().failLimit:L().failSend);return}
  sent.add(k);saveSent();
  $("repMsg").textContent=L().thanks;$("repMsg").hidden=false;$("repSend").textContent=L().sentBtn;
  setTimeout(()=>{closeRep();route()},1200);

let shrKey=null,shrFmt="sq";
function wrap(ctx,text,maxW){const words=text.split(/\s+/);const lines=[];let line="";for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);return lines}
function drawFlag(ctx,x,y,w){const h=w*600/1020,s=w/1020,r=Math.max(5,w*.02);
 ctx.save();ctx.shadowColor="rgba(0,0,0,.5)";ctx.shadowBlur=w*.14;ctx.shadowOffsetY=w*.06;ctx.fillStyle="#003893";ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.restore();
 ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.clip();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle="#003893";ctx.fillRect(0,0,1020,600);ctx.fillStyle="#fff";ctx.fillRect(0,300,1020,150);ctx.fillStyle="#cf2027";ctx.fillRect(0,350,1020,50);
 ctx.translate(382.5,375);ctx.fillStyle="#f7d116";const ro=35,ri=ro*Math.sin(Math.PI/10)/Math.sin(3*Math.PI/10);
 for(let i=0;i<10;i++){ctx.save();ctx.rotate(i*Math.PI/5);ctx.translate(0,-150);ctx.beginPath();for(let k=0;k<10;k++){const q=k%2?ri:ro,a=-Math.PI/2+k*Math.PI/5;ctx.lineTo(q*Math.cos(a),q*Math.sin(a))}ctx.closePath();ctx.fill();ctx.restore()}
 ctx.restore();
 ctx.save();ctx.strokeStyle="rgba(255,255,255,.28)";ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.stroke();ctx.restore()}
const loadImg=u=>new Promise(res=>{const i=new Image();i.crossOrigin="anonymous";const t=setTimeout(()=>res(null),5000);i.onload=()=>{clearTimeout(t);res(i)};i.onerror=()=>{clearTimeout(t);res(null)};i.src=u});
function fitLines(ctx,text,font,size,minSize,maxW,maxLines){let s=size;for(;s>=minSize;s-=4){ctx.font=font.replace("$",s);const l=wrap(ctx,text,maxW);if(l.length<=maxLines)return{s,l}}ctx.font=font.replace("$",minSize);let l=wrap(ctx,text,maxW);if(l.length>maxLines){l=l.slice(0,maxLines);l[maxLines-1]=l[maxLines-1].replace(/\s*\S*$/,"")+"…"}return{s:minSize,l}}
async function drawCard(cv,e,fmt){
 try{await Promise.all(['800 80px "Bricolage Grotesque"','500 40px "Bricolage Grotesque"','400 36px "Literata"','500 28px "JetBrains Mono"'].map(f=>document.fonts.load(f)))}catch(_){}
 const W=1080,H=fmt==="st"?1920:1080;cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#003893");g.addColorStop(1,"#002566");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 let hasImg=false;
 if(e.img){const im=await loadImg(e.img);if(im&&im.naturalWidth){const x0=Math.round(W*.38),w=W-x0,hh=H;const oc=document.createElement("canvas");oc.width=w;oc.height=hh;const o=oc.getContext("2d");const sc=Math.max(w/im.naturalWidth,hh/im.naturalHeight),iw=im.naturalWidth*sc,ih=im.naturalHeight*sc;try{o.filter="saturate(.55)"}catch(_){}o.drawImage(im,(w-iw)/2,(hh-ih)/2,iw,ih);try{o.filter="none"}catch(_){}o.globalCompositeOperation="destination-in";const mg=o.createLinearGradient(0,0,w,0);mg.addColorStop(0,"rgba(0,0,0,0)");mg.addColorStop(.55,"rgba(0,0,0,.55)");mg.addColorStop(1,"#000");o.fillStyle=mg;o.fillRect(0,0,w,hh);ctx.globalAlpha=.34;ctx.drawImage(oc,x0,0);ctx.globalAlpha=1;hasImg=true}}
 const P=88,st=fmt==="st";let y=st?150:84;
 // brand
 ctx.textBaseline="alphabetic";ctx.font='800 56px "Bricolage Grotesque", system-ui, sans-serif';ctx.fillStyle="#fff";ctx.fillText("Hoje",P,y+48);const hw=ctx.measureText("Hoje ").width;
 ctx.fillStyle="#f7d116";const cvw=ctx.measureText("CV").width+28;ctx.beginPath();ctx.roundRect(P+hw,y-2,cvw,64,12);ctx.fill();ctx.fillStyle="#002566";ctx.fillText("CV",P+hw+14,y+48);
 const fw=st?320:260;drawFlag(ctx,W-P-fw,y-8,fw);
 y+=st?470:190;
 // date label
 ctx.font='500 30px "JetBrains Mono", ui-monospace, monospace';ctx.fillStyle="rgba(255,255,255,.78)";
 const lbl=L().cardLbl(e.d,MO(e.m-1));ctx.fillText(lbl,P,y);
 y+=st?225:172;ctx.font=`800 ${st?210:170}px "Bricolage Grotesque", system-ui, sans-serif`;ctx.fillStyle="#f7d116";ctx.fillText(String(e.y),P-6,y);
 y+=st?50:16;
 const maxW=W-2*P;const tt=fitLines(ctx,T(e),'800 $px "Bricolage Grotesque", system-ui, sans-serif',st?92:76,48,maxW,st?4:3);
 ctx.fillStyle="#fff";ctx.font=`800 ${tt.s}px "Bricolage Grotesque", system-ui, sans-serif`;for(const l of tt.l){y+=tt.s*1.08;ctx.fillText(l,P,y)}
 y+=st?80:44;const dd=fitLines(ctx,X(e),'400 $px "Literata", Georgia, serif',st?44:36,28,maxW,st?7:4);
 ctx.fillStyle="rgba(255,255,255,.86)";ctx.font=`400 ${dd.s}px "Literata", Georgia, serif`;for(const l of dd.l){ctx.fillText(l,P,y+dd.s);y+=dd.s*1.45}
 // tags
 y+=st?60:34;ctx.font='500 26px "JetBrains Mono", ui-monospace, monospace';let x=P;
 for(const t of [L().cat1[rotulo(e)]||rotulo(e),PL(e.ilha),ago(e.y)]){const tw=ctx.measureText(t.toUpperCase()).width+40;ctx.fillStyle="rgba(255,255,255,.12)";ctx.beginPath();ctx.roundRect(x,y,tw,52,26);ctx.fill();ctx.fillStyle="#fff";ctx.fillText(t.toUpperCase(),x+20,y+35);x+=tw+14}
 // footer stripes (flag band)
 const fb=H-(st?230:150);ctx.fillStyle="#fff";ctx.fillRect(0,fb,W,36);ctx.fillStyle="#cf2027";ctx.fillRect(0,fb+12,W,12);
 ctx.font='500 23px "JetBrains Mono", ui-monospace, monospace';ctx.fillStyle="rgba(255,255,255,.62)";ctx.fillText(L().cardFoot,P,fb+(st?120:88));ctx.font='500 28px "JetBrains Mono", ui-monospace, monospace';ctx.fillStyle="rgba(255,255,255,.95)";ctx.textAlign="right";ctx.fillText(SITE,W-P,fb+(st?120:88));ctx.textAlign="left";
 if(hasImg&&L().credit){ctx.font='500 20px "JetBrains Mono", ui-monospace, monospace';ctx.fillStyle="rgba(255,255,255,.55)";ctx.textAlign="right";ctx.fillText(L().credit.replace(/^[^A-Za-zÀ-ú]+/,""),W-P,fb-22);ctx.textAlign="left"}
}

async function renderShare(){const e=BYKEY[shrKey];await drawCard($("shrCv"),e,shrFmt);

// pool: se dado, só aparecem os filtros com registos (mais Todas e o selecionado)
function chips(el,val,set,pool){el.innerHTML=Object.entries(L().cats).filter(([k])=>!pool||k==="todas"||k===val||pool.some(e=>hit(e,k))).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===val}">${v}</button>`).join("");
 el.onclick=ev=>{const b=ev.target.closest("button");if(b){set(b.dataset.k);}};}

function renderDay(){
 const m=cur.getMonth()+1,d=cur.getDate();
 $("hDay").textContent=d; $("hMonth").textContent=L().heroMonth(MO(m-1));
 $("hWeek").textContent=L().week[cur.getDay()]+" · "+L().onday;
 $("pick").value=`${cur.getFullYear()}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
 const day=EVENTS.filter(e=>e.m===m&&e.d===d).sort((a,b)=>a.y-b.y);
 const fb=$("featureBox");
 if(!day.length){
  const key=(mm,dd)=>new Date(2024,mm-1,dd).getTime();const k0=key(m,d),YR=366*864e5;
  const near=[...EVENTS].map(e=>{let diff=key(e.m,e.d)-k0;if(diff>YR/2)diff-=YR;if(diff<-YR/2)diff+=YR;return{e,diff}}).sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff)).slice(0,3);
  fb.innerHTML=`<div class="empty"><strong>${L().emptyDay(d,MO(m-1))}</strong><br>${L().emptyMore}<div class="near">${near.map(({e})=>`<button data-m="${e.m}" data-d="${e.d}"><span>${L().shortDate(e.d,MO(e.m-1))} · ${e.y}</span>${esc(T(e))}</button>`).join("")}</div></div>`;
  fb.querySelectorAll(".near button").forEach(b=>b.onclick=()=>{cur.setMonth(+b.dataset.m-1,+b.dataset.d);renderDay()});
 } else {
  const f=day.find(e=>e.top)||day[0];
  fb.innerHTML=`<div class="label" style="margin-bottom:8px">${L().highlight}</div><article class="feature${f.img?" has-img":""}">${imgTag(f,"wash")}<div class="yr">${f.y}${wdTag(f)}</div><h2>${esc(T(f))}</h2><p>${esc(X(f))}</p><div class="meta">${tagCat(f)}<span class="tag">${PL(f.ilha)}</span><span class="tag">${ago(f.y)}</span>${srcLink(f)}</div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div class="acts-row">${shareBtn(f)}${flagBtn(f)}</div>${credit(f)}</div></article>`;
 }
 chips($("chips"),cat,k=>{cat=k;save();renderDay()},day);
 const list=day.filter(e=>hit(e,cat));
 $("dayList").innerHTML=list.length?list.map(e=>itemHTML(e,false)).join(""):`<p class="empty">${L().noneCat}</p>`;
}

function renderExplore(){
 $("eras").innerHTML=ERAS.map(([k])=>`<button data-k="${k}" aria-pressed="${k===era}">${L().eras[k]}</button>`).join("");
 $("eras").onclick=ev=>{const b=ev.target.closest("button");if(b){era=b.dataset.k;save();renderExplore()}};
 chips($("chips2"),cat2,k=>{cat2=k;renderExplore()});
 const [,,a,z]=ERAS.find(x=>x[0]===era);
 const items=EVENTS.filter(e=>e.y>=a&&e.y<=z&&hit(e,cat2)).sort((p,q)=>p.y-q.y||p.m-q.m||p.d-q.d);
 const roman=n=>["XV","XVI","XVII","XVIII","XIX","XX","XXI"][n-15];
 const groups={};items.forEach(e=>{const c=Math.floor((e.y-1)/100)+1;(groups[c]=groups[c]||[]).push(e)});
 $("timeline").innerHTML=Object.keys(groups).length?Object.entries(groups).map(([c,arr])=>`<section class="century"><h2>${LANG==="en"?L().century(ROMAN_EN[roman(+c)]):L().century(roman(+c))}<small>${L().count(arr.length)}</small></h2><div class="list">${arr.map(e=>itemHTML(e,true)).join("")}</div></section>`).join(""):`<p class="empty">${L().noneCombo}</p>`;
}
