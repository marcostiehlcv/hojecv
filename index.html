const fileName=()=>{const e=BYKEY[shrKey];return `hojecv-${e.y}-${String(e.m).padStart(2,"0")}-${String(e.d).padStart(2,"0")}${shrFmt==="st"?"-story":""}.png`};
document.querySelector('#shr .seg2').addEventListener("click",ev=>{const b=ev.target.closest("button");if(b&&b.dataset.f!==shrFmt){shrFmt=b.dataset.f;renderShare()}});
$("shrClose").onclick=closeShare;$("shr").addEventListener("click",ev=>{if(ev.target.id==="shr")closeShare()});
addEventListener("keydown",ev=>{if(ev.key==="Escape"){if(!$("full").hidden){$("full").hidden=true}else if(!$("shr").hidden)closeShare()}});
$("shrSave").onclick=async()=>{const blob=await cardBlob();const name=fileName();
 try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();shrMsg(L().saved)}catch(_){shrMsg(L().saveFail)}};
$("shrNative").onclick=async()=>{try{const blob=await cardBlob();const e=BYKEY[shrKey];await navigator.share({files:[new File([blob],fileName(),{type:"image/png"})],text:shareText(e)})}catch(err){if(err&&err.name!=="AbortError")shrMsg(L().nativeFail)}};
$("shrCopy").onclick=async()=>{const t=shareText(BYKEY[shrKey]);try{await navigator.clipboard.writeText(t);shrMsg(L().copied)}catch(_){shrMsg(t)}};
const openFull=async()=>{const c=document.createElement("canvas");await drawCard(c,BYKEY[shrKey],shrFmt);const f=$("full");f.querySelector("canvas")?.remove();f.prepend(c);f.hidden=false};
$("shrFull").onclick=openFull;$("shrCv").onclick=openFull;$("full").onclick=()=>{$("full").hidden=true};
document.addEventListener("click",ev=>{const b=ev.target.closest(".share[data-s]");if(b)openShare(b.dataset.s)});

// pool: se dado, só aparecem os filtros com registos (mais Todas e o selecionado)
// Centra o filtro escolhido numa fila que desliza (mobile), partindo da posição em que estava
const centra=(el,prev)=>{el.scrollLeft=prev||0;const b=el.querySelector('[aria-pressed="true"]');if(!b||el.scrollWidth<=el.clientWidth)return;el.scrollTo({left:b.offsetLeft-el.offsetLeft-(el.clientWidth-b.offsetWidth)/2,behavior:"smooth"})};
function chips(el,val,set,pool){const prev=el.scrollLeft;el.innerHTML=Object.entries(L().cats).filter(([k])=>!pool||k==="todas"||k===val||pool.some(e=>hit(e,k))).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===val}">${v}</button>`).join("");centra(el,prev);
 el.onclick=ev=>{const b=ev.target.closest("button");if(b){set(b.dataset.k);}};}

function renderDay(){
 const m=cur.getMonth()+1,d=cur.getDate();
 $("hDay").textContent=d; $("hMonth").textContent=L().heroMonth(MO(m-1));
 $("hWeek").textContent=L().week[cur.getDay()]+" · "+L().onday;
 $("pick").value=`${cur.getFullYear()}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
 const day=EVENTS.filter(e=>e.m===m&&e.d===d).sort((a,b)=>a.y-b.y);
 const fb=$("featureBox");
 if(!day.length){
  const key=(mm,dd)=>new Date(2024,mm-1,dd).getTime();const k0=key(m,d),YR=366*864e5;
  const near=[...EVENTS].map(e=>{let diff=key(e.m,e.d)-k0;if(diff>YR/2)diff-=YR;if(diff<-YR/2)diff+=YR;return{e,diff}}).sort((a,b)=>Math.abs(a.diff)-Math.abs(b.diff)).slice(0,3);
  fb.innerHTML=`<div class="empty"><strong>${L().emptyDay(d,MO(m-1))}</strong><br>${L().emptyMore}<div class="near">${near.map(({e})=>`<button data-m="${e.m}" data-d="${e.d}"><span>${L().shortDate(e.d,MO(e.m-1))} · ${e.y}</span>${esc(T(e))}</button>`).join("")}</div></div>`;
  fb.querySelectorAll(".near button").forEach(b=>b.onclick=()=>{cur.setMonth(+b.dataset.m-1,+b.dataset.d);renderDay()});
 } else {
  const f=day.find(e=>e.top)||day[0];
  fb.innerHTML=`<div class="label" style="margin-bottom:8px">${L().highlight}</div><article class="feature${f.img?" has-img":""}">${imgTag(f,"wash")}<div class="yr">${f.y}${wdTag(f)}</div><h2>${esc(T(f))}</h2><p>${esc(X(f))}</p><div class="meta">${tagCat(f)}${tagIlha(f)}<span class="tag">${ago(f.y)}</span></div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div class="acts-row" style="flex:1">${shareBtn(f)}${flagBtn(f)}<span class="srcw">${confTag(f)}${srcLink(f)}</span></div>${credit(f)}</div></article>`;
 }
 chips($("chips"),cat,k=>{cat=k;save();renderDay()},day);
 const list=day.filter(e=>hit(e,cat));
 $("dayList").innerHTML=list.length?list.map(e=>itemHTML(e,false)).join(""):`<p class="empty">${L().noneCat}</p>`;
}

// Linha do tempo: uma linha por registo (ano, data, título), agrupada por século e década; um toque abre o resto
const tlItem=(e,lado)=>`<details class="tl-e ${lado}"><summary><span class="ty">${e.y}</span><span class="td">${L().shortDate(e.d,MO(e.m-1))}</span><span class="tt">${esc(T(e))}</span></summary><div class="tb"><p>${esc(X(e))}</p><div class="meta">${tagCat(e)}${tagIlha(e)}</div><div class="acts-row">${shareBtn(e)}${flagBtn(e)}<span class="srcw">${confTag(e)}${srcLink(e)}</span></div></div></details>`;
// Uma só linha contínua: marcas de século e de década; no computador os cartões alternam à esquerda e à direita
const tlHTML=(groups,tot,cName)=>{let n=0;return `<div class="tlw">${Object.entries(groups).map(([c,arr])=>{let dec=null;return `<div class="tl-m tl-c"><span>${cName(+c)}</span><small>${L().count(tot[c])}</small></div>`+arr.map(e=>{const k=Math.floor(e.y/10)*10;const m=k!==dec?`<div class="tl-m"><span>${L().decade(k)}</span></div>`:"";dec=k;return m+tlItem(e,n++%2?"R":"L")}).join("")}).join("")}</div>`};
function renderExplore(){
 const ICO={lista:'<path d="M3 5h14M3 10h14M3 15h14"/>',linha:'<path d="M6 2v16"/><circle cx="6" cy="5" r="2" fill="currentColor"/><circle cx="6" cy="14" r="2" fill="currentColor"/><path d="M10 5h7M10 14h7"/>'};
 $("vista").setAttribute("aria-label",L().vistaLbl);
 $("vista").innerHTML=["lista","linha"].map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===vista}" aria-label="${L().vistas[k]}" title="${L().vistas[k]}"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${ICO[k]}</svg></button>`).join("");
 $("vista").onclick=ev=>{const b=ev.target.closest("button");if(b&&b.dataset.k!==vista){vista=b.dataset.k;expMax=LOTE;save();renderExplore()}};
 const prevE=$("eras").scrollLeft;$("eras").innerHTML=ERAS.map(([k])=>`<button data-k="${k}" aria-pressed="${k===era}">${L().eras[k]}</button>`).join("");
 centra($("eras"),prevE);
 $("eras").onclick=ev=>{const b=ev.target.closest("button");if(b){era=b.dataset.k;expMax=LOTE;save();renderExplore()}};
 chips($("chips2"),cat2,k=>{cat2=k;expMax=LOTE;renderExplore()});
 const locs=[["",L().cats.todas],...ILHAS.filter(k=>EVENTS.some(e=>e.ilha===k)).map(k=>[k,PL(k)]),[EXT,L().ext]];
 if(ilha2&&!locs.some(x=>x[0]===ilha2))locs.push([ilha2,PL(ilha2)]);
 const prevI=$("ilhas").scrollLeft;$("ilhas").innerHTML=locs.map(([k,v])=>`<button data-k="${esc(k)}" aria-pressed="${k===ilha2}">${esc(v)}</button>`).join("");
 centra($("ilhas"),prevI);
 $("ilhas").onclick=ev=>{const b=ev.target.closest("button");if(b){ilha2=b.dataset.k;expMax=LOTE;renderExplore()}};
 const [,,a,z]=ERAS.find(x=>x[0]===era);
 const items=EVENTS.filter(e=>e.y>=a&&e.y<=z&&hit(e,cat2)&&naIlha(e,ilha2)).sort((p,q)=>p.y-q.y||p.m-q.m||p.d-q.d);
 const roman=n=>["XV","XVI","XVII","XVIII","XIX","XX","XXI"][n-15];
 // Mostra os registos em lotes; «Ver mais» acrescenta o lote seguinte. A contagem do século é a total.
 const tot={};items.forEach(e=>{const c=Math.floor((e.y-1)/100)+1;tot[c]=(tot[c]||0)+1});
 const lim=expMax;
 const groups={};items.slice(0,lim).forEach(e=>{const c=Math.floor((e.y-1)/100)+1;(groups[c]=groups[c]||[]).push(e)});
 $("vcount").textContent=items.length?L().count(items.length):"";
 const cName=c=>LANG==="en"?L().century(ROMAN_EN[roman(c)]):L().century(roman(c));
 $("timeline").innerHTML=!Object.keys(groups).length?`<p class="empty">${L().noneCombo}</p>`:vista==="linha"?tlHTML(groups,tot,cName):Object.entries(groups).map(([c,arr])=>`<section class="century"><h2>${LANG==="en"?L().century(ROMAN_EN[roman(+c)]):L().century(roman(+c))}<small>${L().count(tot[c])}</small></h2><div class="list">${arr.map(e=>itemHTML(e,true)).join("")}</div></section>`).join("");
 if(items.length>lim){const b=document.createElement("button");b.type="button";b.className="more";b.textContent=L().more(Math.min(LOTE,items.length-expMax),items.length-expMax);b.onclick=()=>{expMax+=LOTE;renderExplore()};$("timeline").appendChild(b)}
}

function applyLang(){const t=L();document.documentElement.lang=LANG==="en"?"en":"pt";
 const set=(id,v)=>{const el=$(id);if(el)el.textContent=v};
 set("tab-hoje",t.hoje);set("tab-explorar",t.explorar);set("today",t.today);set("lblCats",t.catsLbl);set("lblEra",t.era);set("lblCat",t.cat);set("lblIlha",t.ilhaLbl);
 set("repTitle",t.repTitle);set("repQ",t.repQ);set("repCancel",t.cancel);set("repSend",t.send);set("shrTitle",t.shrTitle);set("fmtSq",t.sq);
 set("shrSave",t.save);set("shrNative",t.native);set("shrFull",t.full);set("shrCopy",t.copy);set("shrClose",t.close);set("fullHint",t.hint);set("foot",t.foot);set("aboutBtn",t.aboutBtn);{const a=$("apps");if(a)a.innerHTML=`<span>${esc(t.maisApps)}</span>`+APPS.filter(x=>x[0]!==ESTA_APP).map(([k,n,u])=>`<a href="${u}?lang=${LANG}" target="_blank" rel="noopener"><b>${esc(n)}</b> · ${esc(t.appsDesc[k])} <span aria-hidden="true">↗</span></a>`).join("")}set("abtTitle",t.aboutTitle);set("cnfTitle",t.confTitle);set("cnfClose",t.close);{const b=$("cnfBody");if(b){b.innerHTML=`<p>${esc(t.confIntro)}</p>`+["alta","media","baixa"].map(k=>`<p><span class="conf ${k}" style="margin:0">${esc(t.conf[k])}</span><br>${esc(t.confLv[k])}</p>`).join("")+`<p>${esc(t.confNote)}</p>`}}set("abtClose",t.close);{const b=$("abtBody");if(b){b.innerHTML="";t.about.forEach(([h,x])=>{if(h){const s=document.createElement("h3");s.textContent=h;b.appendChild(s)}const p=document.createElement("p");p.textContent=x;b.appendChild(p)})}}
 if($("note")){const u=/^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})$/.exec(window.HOJECV_ATUALIZADO||"");$("note").textContent=u?t.updated(+u[3],MO(+u[2]-1),u[1],u[4]):"";$("note").hidden=!u}
 $("prev").setAttribute("aria-label",t.prev);$("next").setAttribute("aria-label",t.next);$("pick").setAttribute("aria-label",t.pick);$("tabs").setAttribute("aria-label",t.tabs);
 $("shrCv").title=t.cvTitle;document.querySelector('#shr .seg2').setAttribute("aria-label",t.fmtAria);
 const fl=document.querySelector(".flag-cv");if(fl)fl.setAttribute("aria-label",t.flagAlt);
 document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===LANG)));}
$("lang").addEventListener("click",ev=>{const b=ev.target.closest("button[data-l]");if(!b||b.dataset.l===LANG)return;LANG=b.dataset.l;try{localStorage.setItem("hojecv_lang",LANG)}catch(_){}applyLang();route();
 if(!$("shr").hidden&&shrKey){const e=BYKEY[shrKey];renderShare()}});
$("aboutBtn").onclick=()=>{$("abt").hidden=false;$("abtClose").focus()};$("abtClose").onclick=()=>{$("abt").hidden=true};$("abt").addEventListener("click",ev=>{if(ev.target.id==="abt")$("abt").hidden=true});
// Etiquetas de categoria e de ilha: abrem o Explorar filtrado
document.addEventListener("click",ev=>{const t=ev.target.closest(".tagl");if(!t)return;
 if(t.dataset.fc){cat2=t.dataset.fc;ilha2=""}else{ilha2=t.dataset.fi;cat2="todas"}
 era="todas";expMax=LOTE;save();if(location.hash==="#explorar")renderExplore();else location.hash="#explorar";scrollTo(0,0)});
// Botão «i» junto ao nível de confiança: janela só com a explicação dos níveis
document.addEventListener("click",ev=>{if(!ev.target.closest(".confi"))return;$("cnf").hidden=false;$("cnfClose").focus()});
$("cnfClose").onclick=()=>{$("cnf").hidden=true};$("cnf").addEventListener("click",ev=>{if(ev.target.id==="cnf")$("cnf").hidden=true});
addEventListener("keydown",ev=>{if(ev.key==="Escape"){$("abt").hidden=true;$("cnf").hidden=true}});
function route(){const v=location.hash==="#explorar"?"explorar":"hoje";
 $("view-hoje").hidden=v!=="hoje";$("view-explorar").hidden=v!=="explorar";
 $("hero").hidden=v!=="hoje";$("dateline").hidden=v!=="hoje";
 $(v==="hoje"?"view-hoje":"view-explorar").appendChild(document.querySelector(".foot"));
 $("tab-hoje").setAttribute("aria-current",v==="hoje"?"page":"false");$("tab-explorar").setAttribute("aria-current",v==="explorar"?"page":"false");
 v==="hoje"?renderDay():renderExplore();}
$("prev").onclick=()=>{cur.setDate(cur.getDate()-1);renderDay()};
$("next").onclick=()=>{cur.setDate(cur.getDate()+1);renderDay()};
$("today").onclick=()=>{cur=new Date();cur.setHours(12,0,0,0);renderDay()};
$("pick").onchange=e=>{const [y,m,d]=e.target.value.split("-").map(Number);if(y){cur=new Date(y,m-1,d,12);renderDay()}};
addEventListener("hashchange",route);applyLang();route();
// Os dados vêm só do eventos.js (gerado a partir da Google Sheet). O API do config.js serve apenas para os reportes.
window.HOJECV_FONTE="eventos.js";
const mostraFonte=()=>{if(!/[?&]fonte(&|$)/.test(location.search))return;let b=document.getElementById("fonteTag");if(!b){b=document.createElement("div");b.id="fonteTag";b.style.cssText="position:fixed;left:12px;bottom:12px;z-index:30;background:#003893;color:#fff;font:12px/1.3 ui-monospace,monospace;padding:6px 10px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.35)";document.body.appendChild(b)}b.textContent="Dados: "+window.HOJECV_FONTE+" · "+EVENTS.length+" registos"};
mostraFonte();
</script>
</body>
</html>
